<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Email Distributor</title><style>body{font-family:Arial,sans-serif;background:#f4f7fb;margin:0}.wrap{max-width:1000px;margin:auto;padding:20px}.card{background:#fff;padding:20px;border-radius:12px;box-shadow:0 2px 10px rgba(0,0,0,.08)}input,textarea{width:100%;padding:10px;margin:8px 0}button{padding:10px 18px;background:#2563eb;color:#fff;border:none;border-radius:8px;cursor:pointer}.hidden{display:none}</style></head><body><div class="wrap"><div class="card"><h2>Email Distributor</h2><div id="step1"><input id="subject" placeholder="Subject"><textarea id="body" rows="8" placeholder="Email body"></textarea><input type="file" id="sig"><button onclick="go2()">Ready</button></div><div id="step2" class="hidden"><textarea id="recipients" rows="8" placeholder="Paste recipients"></textarea><div id="summary"></div><button onclick="back1()">Back</button><button onclick="go3()">Ready</button></div><div id="step3" class="hidden"><div id="review"></div><button onclick="back2()">Back</button><button id="sendBtn" onclick="sendEmails()">Send</button><pre id="results"></pre></div></div></div><script>let sig='';document.getElementById('sig').onchange=e=>{const r=new FileReader();r.onload=x=>sig=x.target.result;r.readAsDataURL(e.target.files[0]);};function go2(){step1.classList.add('hidden');step2.classList.remove('hidden')}function back1(){step2.classList.add('hidden');step1.classList.remove('hidden')}function back2(){step3.classList.add('hidden');step2.classList.remove('hidden')}function parseEmails(){let e=document.getElementById('recipients').value.split(/[\s,;]+/).filter(Boolean);e=[...new Set(e)];const valid=e.filter(x=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(x));summary.innerHTML='Valid recipients: '+valid.length;return valid;}function go3(){const r=parseEmails();review.innerHTML='<h3>Review</h3><p><b>Subject:</b> '+subject.value+'</p><p>'+body.value.replace(/
/g,'<br>')+'</p>'+(sig?'<img src="'+sig+'" style="max-width:250px">':'')+'<p>Total recipients: '+r.length+'</p><p>Each recipient receives an individual email.</p>';step2.classList.add('hidden');step3.classList.remove('hidden')}async function sendEmails(){sendBtn.disabled=true;const recipients=parseEmails();results.textContent='Sending...';const res=await fetch('/api/send',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({subject:subject.value,body:body.value,signature:sig,recipients})});const data=await res.json();results.textContent=JSON.stringify(data,null,2);}</script></body></html>
